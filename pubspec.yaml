name: hajicare
description: "Aplikasi pendamping ibadah haji dengan navigasi, komunikasi, dan keselamatan jamaah."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  vibration: ^3.2.1
  flutter_tts: ^4.2.2
  shared_preferences: ^2.5.5
  adhan: ^2.0.0+1
  flutter_compass: ^0.8.1
  geolocator: ^14.0.2
  hijri: ^3.0.1
  geocoding: ^5.0.0
  timezone: ^0.11.1
  lat_lng_to_timezone: ^0.2.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  get: ^4.7.3
  ultralytics_yolo: ^0.6.14
  image: ^4.10.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  flutter_blue_plus: ^2.3.12
  mobile_scanner: ^7.4.2
  speech_to_text: ^7.5.0
  google_mlkit_translation: ^0.15.1
  url_launcher: ^6.3.2
  cloud_functions: ^6.5.0
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.1
  tflite_flutter: ^0.12.1
  android_alarm_manager_plus: ^5.1.1
  adhan_foreground_service:
    path: packages/adhan_foreground_service
  video_player: ^2.9.2
  dio: ^5.7.0
  path_provider: ^2.1.5
  image_picker: ^1.2.4
  maplibre_gl: ^0.27.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#1E1A16"
  adaptive_icon_foreground: "assets/icon.jpeg"
  web:
    generate: true
    image_path: "assets/icon.jpeg"
    background_color: "#1E1A16"
    theme_color: "#D4AF37"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.jpeg
    - assets/models/money_recognition.tflite
    - assets/models/labels.txt
    - assets/models/hajicare_prototypes.json
    - assets/models/bisindo/bisindo_motion_gru_float16.tflite
    - assets/models/bisindo/labels.txt
    - assets/models/bisindo/model_metadata.json
    - assets/models/sibi/
    - assets/audio/
    - assets/sign_language/offline/bisindo/alfabet/
    - assets/sign_language/offline/bisindo/kalimat/
    - assets/sign_language/offline/sibi/kalimat/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
        - asset: assets/fonts/Montserrat-Italic-Variable.ttf
          style: italic
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
